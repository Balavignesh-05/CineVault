name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Production Target URL'
        required: true
        default: 'https://cine-vault-gules.vercel.app'

jobs:
  smoke-test:
    name: Production E2E Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Smoke Suite against Target URL
        env:
          NEXT_PUBLIC_APP_URL: ${{ github.event.inputs.target_url }}
        run: pnpm --filter @cinevault/web test:e2e
